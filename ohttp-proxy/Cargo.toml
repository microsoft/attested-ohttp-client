[package]
name = "ohttp-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
regex = "1.0"
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
log = "0.4"

[dependencies.ohttp-client]
path = "../ohttp-client"